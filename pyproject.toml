[tool.poetry]
name = "python-project"
version = "0.1.0"
description = "Python project with testing infrastructure"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.8"
pynput = "1.7.6"
pyobjc-core = {version = "8.2", markers = "sys_platform == 'darwin'"}
pyobjc-framework-ApplicationServices = {version = "8.2", markers = "sys_platform == 'darwin'"}
pyobjc-framework-Cocoa = {version = "8.2", markers = "sys_platform == 'darwin'"}
pyobjc-framework-Quartz = {version = "8.2", markers = "sys_platform == 'darwin'"}
six = "1.16.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"

[tool.poetry.scripts]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "-v"
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests", 
    "slow: marks tests as slow running"
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "env/*",
    ".env/*",
    "*/site-packages/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "manage.py",
    "setup.py",
    "conftest.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
show_missing = true
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"